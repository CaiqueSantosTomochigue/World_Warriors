<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Warriors | Avaliação</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<!-- <body onload="validarSessao(), atualizarFeed()" style="background-color: #161618;"> -->

<body>

    <div class="janela">

        <div class="header-left">
            <div class="titulo">
                <img src="../assets/icon/img_logo.png" alt="">
                <h1>World Warriors</h1>
            </div>


            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
                <a href="./personagens.html">
                    <h3>Personagens</h3>
                </a>
            </div>


            <div class="btn-nav" id="ativo">
                <a href="./avaliacao.html">
                    <h3>Avaliação</h3>
                </a>
            </div>

            <div class="btn-nav-white">

                <a href="./dashboard.html">
                    <h3>Dashboard</h3>
                </a>

            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <img src="../assets/icon/icon_log_out.svg" alt="">
                <h3>Sair</h3>
            </div>

        </div>

        <div class="dash">
            <div class="titulo_dashboard">
                <h2>AVALIE O JOGO</h2>
                <p>Dê de 1 a 5 estrelas e conte o que você achou de Street Fighter II.</p>
            </div>

            <div class="avaliacao_dash">

                <div class="card_capa">
                    <img src="../assets/sobre_page.png" alt="Capa de Street Fighter II: World Warrior">
                    <p>Street Fighter II: World Warrior</p>
                </div>

                <div class="card_avaliacao">
                    <p class="rotulo_avaliacao">SUA NOTA</p>

                    <div class="estrelas">
                        <button class="estrela" id="estrela_1" onclick="selecionar(1)">☆</button>
                        <button class="estrela" id="estrela_2" onclick="selecionar(2)">☆</button>
                        <button class="estrela" id="estrela_3" onclick="selecionar(3)">☆</button>
                        <button class="estrela" id="estrela_4" onclick="selecionar(4)">☆</button>
                        <button class="estrela" id="estrela_5" onclick="selecionar(5)">☆</button>
                    </div>

                    <p class="dica_avaliacao">Escolha de 1 a 5 estrelas.</p>

                    <label class="rotulo_avaliacao">SUA OPINIÃO</label>
                    <textarea id="ipt_opiniao" maxlength="150" rows="5"
                        placeholder="O que você achou do jogo?"></textarea>
                    <p class="contador_avaliacao" id="contador_opiniao">0/150</p>

                    <button class="btn_enviar" id="btn_enviar">ENVIAR AVALIAÇÃO</button>
                </div>

            </div>
        </div>
    </div>





</body>

</html>

<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;


</script>
