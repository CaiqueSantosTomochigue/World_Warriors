<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>World Warriors | Login</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/estilo.css" />
  <link rel="icon" href="./assets/icon/img_logo.png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body id="body_cadastro_login" onload="listar()">
  <header>
    <nav class="nav_cadastro_login">
      <a href="./index.html">
        <img src="./assets/icon/img_logo.png" alt="logo_header" id="img_logo_menu" />
      </a>
      <div class="itens_menu">
        <a href="./index.html">Página Inicial</a>
        <a href="./cadastro.html">
          <button id="btn_login_menu">
            <img src="./assets/icon/cadastro_icon.svg" alt="">
            Cadastro
          </button>
        </a>
      </div>
    </nav>
  </header>

  <main>
    <div class="container_cadastro_login">
      <div class="cards_cadastro_login">
        <div class="categoria_card">
          <p>ACESSO</p>
        </div>
        <div class="titulo_card">
          <h2>Entrar</h2>
          <p>Utilize o email e senha cadastrados</p>
        </div>

        <div class="campos_card">
          <div class="campo">
            <p>E-mail:</p>
            <input class="input" id="ipt_email" placeholder="email@.com">
          </div>


          <div class="campo">
            <p>Senha:</p>
            <input type="password" class="input" id="ipt_senha" placeholder="Crie uma senha">
          </div>

          <div class="btn_cadastro_login">
            <button onclick="entrar()">Entrar</button>
          </div>
        </div>
      </div>

    </div>
  </main>
</body>

</html>

<script>


    function entrar() {
        aguardar();

        var emailVar = ipt_email.value;
        var senhaVar = ipt_senha.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
