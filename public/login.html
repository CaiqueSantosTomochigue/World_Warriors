<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>World Warriors | Login</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/estilo.css" />
  <link rel="icon" href="./assets/icon/img_logo.png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body id="body_cadastro_login">
  <header>
    <nav class="nav_cadastro_login">
      <a href="./index.html">
        <img src="./assets/icon/img_logo.png" alt="logo_header" id="img_logo_menu" />
      </a>
      <div class="itens_menu">
        <a href="./index.html">Página Inicial</a>
        <a href="./cadastro.html">
          <button id="btn_login_menu">
            <img src="./assets/icon/cadastro_icon.svg" alt="">
            Cadastro
          </button>
        </a>
      </div>
    </nav>
  </header>

  <main>
    <div class="container_cadastro_login">
      <div class="alerta_erro" id="alertaErro">
        <div class="card_erro" id="cardErro">
          <button class="btn_fechar_card" onclick="fechar_card()">X</button>
          <span id="mensagem_erro"></span>
        </div>
      </div>

      <div class="cards_cadastro_login">
        <div class="categoria_card">
          <p>ACESSO</p>
        </div>
        <div class="titulo_card">
          <h2>Entrar</h2>
          <p>Utilize o email e senha cadastrados</p>
        </div>

        <div class="campos_card">
          <div class="campo">
            <p>E-mail:</p>
            <input class="input" id="ipt_email" placeholder="email@.com">
          </div>


          <div class="campo">
            <p>Senha:</p>
            <input type="password" class="input" id="ipt_senha" placeholder="Crie uma senha">
          </div>

          <div class="btn_cadastro_login" onclick="entrar()">
            <button >Entrar</button>
          </div>

          <div id="div_aguardar" class="loading-div" style="display: none;">
            <img src="./assets/circle-loading.gif" id="loading-gif">
          </div>

          <div id="div_erros_login"></div>
        </div>
      </div>

    </div>
  </main>
</body>

</html>

<script>
  function fechar_card() {
    alertaErro.style.display = "none";
    cardErro.style.display = "none";
  }

  function entrar() {
    aguardar();

    var emailVar = ipt_email.value.trim();
    var senhaVar = ipt_senha.value;

    if (emailVar == "" || senhaVar == "") {
      alertaErro.style.display = "flex";
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Preencha o e-mail e a senha para entrar.";
      finalizarAguardar();
      return false;
    }

    console.log("FORM LOGIN: ", emailVar);
    console.log("FORM SENHA: ", senhaVar);

    fetch("/usuarios/autenticar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        emailServer: emailVar,
        senhaServer: senhaVar
      })
    })
      .then(function (resposta) {
        console.log("ESTOU NO THEN DO entrar()!");

        if (resposta.ok) {
          console.log(resposta);

          resposta.json().then(json => {
            console.log(json);
            console.log(JSON.stringify(json));
            sessionStorage.EMAIL_USUARIO = json.email;
            sessionStorage.NOME_USUARIO = json.nome;
            sessionStorage.ID_USUARIO = json.id;

            setTimeout(function () {
              window.location = "./dashboard/personagens.html";
            }, 1000);
          });
        } else {
          console.log("Houve um erro ao tentar realizar o login!");

          resposta.text().then(texto => {
            console.error(texto);
            finalizarAguardar();
            alertaErro.style.display = "flex";
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = texto || "E-mail ou senha inválidos!";
          });
        }
      })
      .catch(function (erro) {
        console.log(erro);
        finalizarAguardar();
        alertaErro.style.display = "flex";
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Erro de conexão ao tentar entrar. Tente novamente.";
      });

    return false;
  }
</script>
