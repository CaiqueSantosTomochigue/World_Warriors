<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>World Warriors | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/estilo.css" />
  <link rel="icon" href="./assets/icon/img_logo.png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body id="body_cadastro_login">
  <header>
    <nav class="nav_cadastro_login">
      <a href="./index.html">
        <img src="./assets/icon/img_logo.png" alt="logo_header" id="img_logo_menu" />
      </a>
      <div class="itens_menu">
        <a href="./index.html">Página Inicial</a>
        <a href="./login.html">
          <button id="btn_login_menu">
            <img src="./assets/icon/login_icon.svg" alt="" />
            Login
          </button>
        </a>
      </div>
    </nav>
  </header>

  <main>
    <div class="container_cadastro_login">
      <div class="alerta_erro" id="alertaErro">
        <div class="card_erro" id="cardErro">
          <button class="btn_fechar_card" onclick="fechar_card()">X</button>
          <span id="mensagem_erro"></span>
        </div>
      </div>
      <div class="cards_cadastro_login">
        <div class="categoria_card">
          <p>ACESSO</p>
        </div>
        <div class="titulo_card">
          <h2>Criar conta</h2>
          <p>Preencha os dados abaixo para o cadastro</p>
        </div>

        <div class="campos_card">
          <div class="campo">
            <p>Nome:</p>
            <input class="input" id="ipt_nome" placeholder="Seu nome completo">
          </div>

          <div class="campo">
            <p>E-mail:</p>
            <input class="input" id="ipt_email" placeholder="email@.com">
          </div>


          <div class="campo">
            <p>Senha:</p>
            <input type="password" class="input" id="ipt_senha" placeholder="Crie uma senha">
          </div>

          <div class="campo">
            <p>Confirmação da Senha:</p>
            <input type="password" class="input" id="ipt_confirmacao_senha" placeholder="Repita a senha">
          </div>

          <div class="btn_cadastro_login" onclick="cadastrar()">
            <button >Criar Conta</button>
          </div>

          <div id="div_aguardar" class="loading-div" style="display: none;">
            <img src="./assets/circle-loading.gif" id="loading-gif">
          </div>

          <div id="div_erros_login"></div>
        </div>
      </div>

    </div>
  </main>
</body>

</html>

<script>

  function fechar_card() {
    alertaErro.style.display = "none";
    cardErro.style.display = "none";
  }

  function cadastrar() {
    var nomeVar = ipt_nome.value.trim();
    var emailVar = ipt_email.value.trim();
    var senhaVar = ipt_senha.value;
    var confirmacaoSenhaVar = ipt_confirmacao_senha.value;

    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      alertaErro.style.display = "flex";
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Preencha todos os campos que estão em branco.";
      return false;
    }

    if (senhaVar != confirmacaoSenhaVar) {
      alertaErro.style.display = "flex";
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "As senhas não são iguais.";
      return false;
    }

    if (!emailVar.includes("@")) {
      alertaErro.style.display = "flex";
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "E-mail inválido! O e-mail deve conter pelo menos um '@'.";
      return false;
    }

    if (!emailVar.includes(".") || emailVar.indexOf("@") > emailVar.lastIndexOf(".")) {
      alertaErro.style.display = "flex";
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "E-mail inválido! Insira um domínio válido (ex: email@dominio.com).";
      return false;
    }

    if (senhaVar.trim().length <= 7) {
      alertaErro.style.display = "flex";
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "A senha precisa ser maior que 7 caracteres.";
      return false;
    }

    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);
        div_aguardar.style.display = "none";

        if (resposta.ok) {
          alertaErro.style.display = "flex";
          cardErro.style.display = "block";
          mensagem_erro.innerHTML = "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, 2000);
        } else {
          alertaErro.style.display = "flex";
          cardErro.style.display = "block";
          mensagem_erro.innerHTML = "Houve um erro ao tentar realizar o cadastro!";
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        div_aguardar.style.display = "none";
      });

    return false;
  }
</script>
